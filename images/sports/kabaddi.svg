<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-kabaddi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1a06"/>
      <stop offset="100%" stop-color="#0a0501"/>
    </linearGradient>
    <linearGradient id="border-kabaddi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f1a"/>
      <stop offset="50%" stop-color="#ee5253"/>
      <stop offset="100%" stop-color="#b71540"/>
    </linearGradient>
    <filter id="glow-kabaddi" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#ff9f1a" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Frame -->
  <rect x="8" y="8" width="144" height="144" rx="28" fill="url(#bg-kabaddi)" stroke="url(#border-kabaddi)" stroke-width="2"/>
  <circle cx="80" cy="80" r="54" fill="none" stroke="rgba(255,159,26,0.12)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Kabaddi Mat Lines (Midline, Baulk Line, Bonus Line) -->
  <g stroke="rgba(255,255,255,0.22)" stroke-width="1.2">
    <!-- Midline -->
    <line x1="28" y1="120" x2="132" y2="120" stroke-width="2.5" stroke="#ff9f1a"/>
    <!-- Baulk line -->
    <line x1="28" y1="110" x2="132" y2="110" stroke="#ee5253" stroke-width="1.5" stroke-dasharray="6 3"/>
    <!-- Bonus line -->
    <line x1="28" y1="102" x2="132" y2="102" stroke="#ffc048" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <!-- Dynamic Athletic Duel: Raider reaching across with Hand-Touch vs Defenders -->
  <g filter="url(#glow-kabaddi)">
    <!-- Raider (Left side leaping forward with extended hand) -->
    <g fill="#ff9f1a">
      <!-- Head -->
      <circle cx="98" cy="46" r="6"/>
      <!-- Torso angled aggressively forward -->
      <path d="M 94 52 L 80 66 L 75 62 L 90 50 Z"/>
      <!-- Raider outstretched arm reaching for touch -->
      <path d="M 92 52 L 122 56 L 126 53 L 94 48 Z"/>
      <!-- Fingers pointing for hand touch -->
      <path d="M 122 54 L 132 55 L 128 58 Z" fill="#ffd32a"/>
      <!-- Trailing arm for balance -->
      <path d="M 88 54 L 76 44 L 73 47 L 84 58 Z"/>
      <!-- Powerful bent lead leg (thrusting towards midline) -->
      <path d="M 80 65 L 94 78 L 98 94 L 92 95 L 88 82 L 76 70 Z"/>
      <!-- Extended rear leg (toe touch / bonus line reach) -->
      <path d="M 76 64 L 56 68 L 44 80 L 40 76 L 52 64 L 72 60 Z"/>
    </g>

    <!-- Defender Grip / Tackle Hand Lock (Right side) -->
    <g fill="#ee5253" opacity="0.9">
      <!-- Head -->
      <circle cx="132" cy="74" r="5.5"/>
      <!-- Defender lunging in for ankle hold / thigh grab -->
      <path d="M 130 80 L 115 90 L 112 85 L 126 78 Z"/>
      <path d="M 122 83 L 102 88 L 100 84 L 118 78 Z"/>
      <path d="M 115 90 L 122 108 L 116 109 L 110 94 Z"/>
    </g>
  </g>

  <!-- Power Sparks / Raid Energy Strike -->
  <g stroke="#ffd32a" stroke-width="1.8" stroke-linecap="round">
    <line x1="126" y1="44" x2="132" y2="40"/>
    <line x1="134" y1="48" x2="140" y2="48"/>
    <line x1="128" y1="56" x2="136" y2="60"/>
  </g>
</svg>