<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-badminton" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2233"/>
      <stop offset="100%" stop-color="#030c14"/>
    </linearGradient>
    <linearGradient id="border-badminton" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fe3ff"/>
      <stop offset="50%" stop-color="#00cec9"/>
      <stop offset="100%" stop-color="#0984e3"/>
    </linearGradient>
    <linearGradient id="cork-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#7f8c8d"/>
    </linearGradient>
    <filter id="glow-shuttle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3fe3ff" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Frame -->
  <rect x="8" y="8" width="144" height="144" rx="28" fill="url(#bg-badminton)" stroke="url(#border-badminton)" stroke-width="2"/>
  <circle cx="80" cy="80" r="54" fill="none" stroke="rgba(63,227,255,0.1)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Crossed Racquets in background -->
  <g stroke="#3fe3ff" stroke-width="1.8" fill="none" opacity="0.6">
    <!-- Racquet 1 (tilted left) -->
    <g transform="rotate(-35 80 80)">
      <ellipse cx="80" cy="46" rx="16" ry="21"/>
      <line x1="80" y1="67" x2="80" y2="114"/>
      <!-- Strings -->
      <line x1="72" y1="36" x2="72" y2="56" stroke-width="0.8" opacity="0.5"/>
      <line x1="80" y1="28" x2="80" y2="64" stroke-width="0.8" opacity="0.5"/>
      <line x1="88" y1="36" x2="88" y2="56" stroke-width="0.8" opacity="0.5"/>
      <line x1="68" y1="42" x2="92" y2="42" stroke-width="0.8" opacity="0.5"/>
      <line x1="66" y1="50" x2="94" y2="50" stroke-width="0.8" opacity="0.5"/>
      <!-- Grip -->
      <rect x="78" y="104" width="4" height="18" rx="2" fill="#0984e3"/>
    </g>
    <!-- Racquet 2 (tilted right) -->
    <g transform="rotate(35 80 80)">
      <ellipse cx="80" cy="46" rx="16" ry="21"/>
      <line x1="80" y1="67" x2="80" y2="114"/>
      <!-- Strings -->
      <line x1="72" y1="36" x2="72" y2="56" stroke-width="0.8" opacity="0.5"/>
      <line x1="80" y1="28" x2="80" y2="64" stroke-width="0.8" opacity="0.5"/>
      <line x1="88" y1="36" x2="88" y2="56" stroke-width="0.8" opacity="0.5"/>
      <line x1="68" y1="42" x2="92" y2="42" stroke-width="0.8" opacity="0.5"/>
      <line x1="66" y1="50" x2="94" y2="50" stroke-width="0.8" opacity="0.5"/>
      <!-- Grip -->
      <rect x="78" y="104" width="4" height="18" rx="2" fill="#0984e3"/>
    </g>
  </g>

  <!-- Foreground Shuttlecock (Center) -->
  <g filter="url(#glow-shuttle)" transform="translate(80, 80)">
    <!-- Feathers fan -->
    <path d="M -26 -28 L 26 -28 L 11 10 L -11 10 Z" fill="rgba(255,255,255,0.18)"/>
    <!-- Individual Feathers -->
    <path d="M -24 -26 L -8 10 M -16 -28 L -5 10 M -8 -30 L -2 10 M 0 -30 L 0 10 M 8 -30 L 2 10 M 16 -28 L 5 10 M 24 -26 L 8 10" stroke="#f5f6fa" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Shuttle Feather Ribbons/Threads -->
    <path d="M -20 -15 Q 0 -10 20 -15" fill="none" stroke="#3fe3ff" stroke-width="1.5"/>
    <path d="M -15 -2 Q 0 3 15 -2" fill="none" stroke="#3fe3ff" stroke-width="1.5"/>
    <!-- Cork Base -->
    <path d="M -11 10 Q -11 25 0 25 Q 11 25 11 10 Z" fill="url(#cork-grad)" stroke="#3fe3ff" stroke-width="1"/>
    <!-- Cork tape collar -->
    <rect x="-11" y="8" width="22" height="4" fill="#e74c3c"/>
  </g>
</svg>
