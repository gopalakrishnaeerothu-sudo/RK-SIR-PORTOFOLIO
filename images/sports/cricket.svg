<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cricket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1e38"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="border-cricket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fe3ff"/>
      <stop offset="50%" stop-color="#14a8c6"/>
      <stop offset="100%" stop-color="#0a4d78"/>
    </linearGradient>
    <linearGradient id="bat-wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2a868"/>
      <stop offset="50%" stop-color="#bf803b"/>
      <stop offset="100%" stop-color="#8f571b"/>
    </linearGradient>
    <linearGradient id="ball-red" x1="30%" y1="30%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5e62"/>
      <stop offset="40%" stop-color="#d61a29"/>
      <stop offset="100%" stop-color="#6b060f"/>
    </linearGradient>
    <filter id="glow-cricket" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Frame -->
  <rect x="8" y="8" width="144" height="144" rx="28" fill="url(#bg-cricket)" stroke="url(#border-cricket)" stroke-width="2"/>
  <circle cx="80" cy="80" r="54" fill="none" stroke="rgba(63,227,255,0.08)" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Stumps & Bails -->
  <g stroke="#d4a373" stroke-linecap="round">
    <!-- 3 Stumps -->
    <line x1="56" y1="52" x2="56" y2="108" stroke-width="3"/>
    <line x1="64" y1="50" x2="64" y2="108" stroke-width="3"/>
    <line x1="72" y1="52" x2="72" y2="108" stroke-width="3"/>
    <!-- Bails -->
    <line x1="54" y1="50" x2="65" y2="49" stroke-width="2.5" stroke="#f6c28b"/>
    <line x1="63" y1="49" x2="74" y2="50" stroke-width="2.5" stroke="#f6c28b"/>
  </g>

  <!-- Cricket Bat (angled) -->
  <g transform="rotate(-35 96 82)">
    <!-- Handle -->
    <rect x="93.5" y="30" width="5" height="26" rx="2.5" fill="#f1f5f9"/>
    <!-- Grip wraps -->
    <line x1="93.5" y1="36" x2="98.5" y2="36" stroke="#0a86d8" stroke-width="1.5"/>
    <line x1="93.5" y1="42" x2="98.5" y2="42" stroke="#0a86d8" stroke-width="1.5"/>
    <line x1="93.5" y1="48" x2="98.5" y2="48" stroke="#0a86d8" stroke-width="1.5"/>
    <!-- Blade -->
    <path d="M 91 56 L 101 56 L 102 110 Q 102 116 96 116 Q 90 116 90 110 Z" fill="url(#bat-wood)"/>
    <!-- Blade spine highlight -->
    <line x1="96" y1="58" x2="96" y2="112" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  </g>

  <!-- Cricket Ball -->
  <circle cx="108" cy="100" r="15" fill="url(#ball-red)" filter="url(#glow-cricket)"/>
  <!-- Ball Seam -->
  <path d="M 96 95 Q 108 100 120 105" fill="none" stroke="#fff" stroke-width="1.8" stroke-dasharray="2 1.5"/>
  <circle cx="103" cy="94" r="2.5" fill="rgba(255,255,255,0.6)"/>
</svg>