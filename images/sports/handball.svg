<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-handball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a38"/>
      <stop offset="100%" stop-color="#050714"/>
    </linearGradient>
    <linearGradient id="border-handball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4bcffa"/>
      <stop offset="50%" stop-color="#0fbcf9"/>
      <stop offset="100%" stop-color="#3c40c6"/>
    </linearGradient>
    <radialGradient id="ball-handball" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#34e7e4"/>
      <stop offset="45%" stop-color="#00d8d6"/>
      <stop offset="90%" stop-color="#05c46b"/>
      <stop offset="100%" stop-color="#0be881"/>
    </radialGradient>
    <filter id="glow-handball" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0fbcf9" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Frame -->
  <rect x="8" y="8" width="144" height="144" rx="28" fill="url(#bg-handball)" stroke="url(#border-handball)" stroke-width="2"/>
  <circle cx="80" cy="80" r="54" fill="none" stroke="rgba(75,207,250,0.12)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Handball Goal Post & Net in Background -->
  <g>
    <!-- Goal frame with red & white stripes -->
    <path d="M 32 118 L 32 46 L 90 46" fill="none" stroke="#ff3f34" stroke-width="4" stroke-linecap="round"/>
    <!-- Goal net grid -->
    <g stroke="rgba(255,255,255,0.2)" stroke-width="1">
      <line x1="32" y1="60" x2="90" y2="60"/>
      <line x1="32" y1="74" x2="90" y2="74"/>
      <line x1="32" y1="88" x2="90" y2="88"/>
      <line x1="32" y1="102" x2="90" y2="102"/>
      <line x1="46" y1="46" x2="46" y2="118"/>
      <line x1="60" y1="46" x2="60" y2="118"/>
      <line x1="74" y1="46" x2="74" y2="118"/>
    </g>
  </g>

  <!-- Powerful Jump Shot Speed Trails -->
  <path d="M 126 122 Q 110 90 88 80" fill="none" stroke="#4bcffa" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round" opacity="0.6"/>

  <!-- Team Handball (Textured 32-Panel Ball) -->
  <g filter="url(#glow-handball)" transform="translate(88, 76)">
    <!-- Base ball circle -->
    <circle cx="0" cy="0" r="32" fill="url(#ball-handball)" stroke="#0be881" stroke-width="1.8"/>

    <!-- Distinctive Grip Hexagons / Panels -->
    <polygon points="0,-10 9.5,-3 5.9,8 -5.9,8 -9.5,-3" fill="#1e272e" opacity="0.75"/>
    <line x1="0" y1="-10" x2="0" y2="-22" stroke="#1e272e" stroke-width="1.8"/>
    <line x1="9.5" y1="-3" x2="20" y2="-7" stroke="#1e272e" stroke-width="1.8"/>
    <line x1="5.9" y1="8" x2="12" y2="18" stroke="#1e272e" stroke-width="1.8"/>
    <line x1="-5.9" y1="8" x2="-12" y2="18" stroke="#1e272e" stroke-width="1.8"/>
    <line x1="-9.5" y1="-3" x2="-20" y2="-7" stroke="#1e272e" stroke-width="1.8"/>

    <!-- Outer panel lines -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#1e272e" stroke-width="1.5" stroke-dasharray="8 6"/>

    <!-- Textured grip dimples / dots -->
    <circle cx="-14" cy="-14" r="1.2" fill="#fff" opacity="0.6"/>
    <circle cx="14" cy="-14" r="1.2" fill="#fff" opacity="0.6"/>
    <circle cx="16" cy="12" r="1.2" fill="#fff" opacity="0.6"/>
    <circle cx="-16" cy="12" r="1.2" fill="#fff" opacity="0.6"/>

    <!-- Specular Highlight -->
    <ellipse cx="-10" cy="-12" rx="7" ry="3.5" transform="rotate(-30 -10 -12)" fill="rgba(255,255,255,0.45)"/>
  </g>
</svg>
