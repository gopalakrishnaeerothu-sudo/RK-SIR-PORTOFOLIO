<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-tennikoit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a142e"/>
      <stop offset="100%" stop-color="#0b040d"/>
    </linearGradient>
    <linearGradient id="border-tennikoit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e056fd"/>
      <stop offset="50%" stop-color="#be2edd"/>
      <stop offset="100%" stop-color="#686de0"/>
    </linearGradient>
    <radialGradient id="ring-rubber" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff7979"/>
      <stop offset="50%" stop-color="#eb4d4b"/>
      <stop offset="100%" stop-color="#9b111e"/>
    </radialGradient>
    <filter id="glow-tennikoit" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#e056fd" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Frame -->
  <rect x="8" y="8" width="144" height="144" rx="28" fill="url(#bg-tennikoit)" stroke="url(#border-tennikoit)" stroke-width="2"/>
  <circle cx="80" cy="80" r="54" fill="none" stroke="rgba(224,86,253,0.12)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- High Court Net -->
  <g stroke="rgba(255,255,255,0.22)">
    <line x1="30" y1="95" x2="130" y2="95" stroke-width="2" stroke="#e056fd"/>
    <line x1="30" y1="105" x2="130" y2="105" stroke-width="1"/>
    <line x1="30" y1="115" x2="130" y2="115" stroke-width="1"/>
    <!-- Vertical mesh -->
    <line x1="45" y1="95" x2="45" y2="120" stroke-width="0.8"/>
    <line x1="60" y1="95" x2="60" y2="120" stroke-width="0.8"/>
    <line x1="75" y1="95" x2="75" y2="120" stroke-width="0.8"/>
    <line x1="90" y1="95" x2="90" y2="120" stroke-width="0.8"/>
    <line x1="105" y1="95" x2="105" y2="120" stroke-width="0.8"/>
    <line x1="120" y1="95" x2="120" y2="120" stroke-width="0.8"/>
  </g>

  <!-- Flight Path / Motion Swoosh -->
  <path d="M 40 120 C 50 60, 80 40, 100 55" fill="none" stroke="#e056fd" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- The Tenni-Koit Ring (tilted perspective ring in flight) -->
  <g filter="url(#glow-tennikoit)" transform="translate(82, 60) rotate(-22)">
    <!-- Outer Toro Body -->
    <ellipse cx="0" cy="0" rx="36" ry="18" fill="none" stroke="url(#ring-rubber)" stroke-width="12"/>
    <!-- Inner cut hole edge highlight -->
    <ellipse cx="0" cy="0" rx="30" ry="12" fill="none" stroke="#ff7979" stroke-width="1.2" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="42" ry="24" fill="none" stroke="#9b111e" stroke-width="1.2" opacity="0.7"/>
    <!-- Grip rib textures across ring -->
    <line x1="-34" y1="-5" x2="-26" y2="5" stroke="#fff" stroke-width="1" opacity="0.4"/>
    <line x1="-15" y1="-14" x2="-10" y2="-4" stroke="#fff" stroke-width="1" opacity="0.4"/>
    <line x1="10" y1="-16" x2="15" y2="-6" stroke="#fff" stroke-width="1" opacity="0.4"/>
    <line x1="30" y1="-8" x2="36" y2="2" stroke="#fff" stroke-width="1" opacity="0.4"/>
    <!-- High gloss specular highlight -->
    <path d="M -22 -12 Q 0 -17 22 -12" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
