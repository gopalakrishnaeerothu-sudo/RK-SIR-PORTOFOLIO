<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-bball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f142a"/>
      <stop offset="100%" stop-color="#080511"/>
    </linearGradient>
    <linearGradient id="border-bball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f43"/>
      <stop offset="50%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#5f1325"/>
    </linearGradient>
    <radialGradient id="ball-orange" cx="38%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#ffa34d"/>
      <stop offset="45%" stop-color="#f36c12"/>
      <stop offset="90%" stop-color="#b83804"/>
      <stop offset="100%" stop-color="#731f00"/>
    </radialGradient>
    <filter id="glow-bball" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f36c12" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Frame -->
  <rect x="8" y="8" width="144" height="144" rx="28" fill="url(#bg-bball)" stroke="url(#border-bball)" stroke-width="2"/>
  <circle cx="80" cy="80" r="54" fill="none" stroke="rgba(255,159,67,0.12)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Backboard silhouette in background -->
  <rect x="36" y="28" width="46" height="34" rx="2" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <rect x="49" y="40" width="20" height="15" fill="none" stroke="rgba(255,159,67,0.4)" stroke-width="1.5"/>
  <line x1="48" y1="56" x2="70" y2="56" stroke="#ff5252" stroke-width="3" stroke-linecap="round"/>
  <!-- Net strings -->
  <path d="M 50 56 L 54 70 L 64 70 L 68 56 M 57 56 L 59 70 M 61 56 L 59 70" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>

  <!-- Basketball -->
  <g filter="url(#glow-bball)">
    <circle cx="92" cy="92" r="34" fill="url(#ball-orange)"/>
    <!-- Black ribs / seams -->
    <path d="M 58 92 L 126 92" stroke="#2a1005" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 92 58 L 92 126" stroke="#2a1005" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Curved seams -->
    <path d="M 69 68 Q 92 84 115 68" fill="none" stroke="#2a1005" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 69 116 Q 92 100 115 116" fill="none" stroke="#2a1005" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Specular highlight -->
    <ellipse cx="80" cy="74" rx="8" ry="4" transform="rotate(-30 80 74)" fill="rgba(255,255,255,0.3)"/>
  </g>
</svg>