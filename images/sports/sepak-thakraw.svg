<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sepak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14261d"/>
      <stop offset="100%" stop-color="#040d08"/>
    </linearGradient>
    <linearGradient id="border-sepak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1c40f"/>
      <stop offset="50%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#16a085"/>
    </linearGradient>
    <linearGradient id="rattan-band" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="50%" stop-color="#fdcb6e"/>
      <stop offset="100%" stop-color="#d39e00"/>
    </linearGradient>
    <filter id="glow-sepak" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f1c40f" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Frame -->
  <rect x="8" y="8" width="144" height="144" rx="28" fill="url(#bg-sepak)" stroke="url(#border-sepak)" stroke-width="2"/>
  <circle cx="80" cy="80" r="54" fill="none" stroke="rgba(241,196,15,0.12)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- High Net Line -->
  <line x1="28" y1="110" x2="132" y2="110" stroke="#2ecc71" stroke-width="2" stroke-linecap="round"/>
  <path d="M 28 110 L 132 110 L 132 126 L 28 126 Z" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Acrobatic Bicycle Kick Motion Curve -->
  <path d="M 38 120 C 50 80, 65 40, 106 50" fill="none" stroke="rgba(241,196,15,0.4)" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Sepak Takraw Woven Rattan Ball -->
  <g filter="url(#glow-sepak)" transform="translate(82, 70)">
    <!-- Dark hollow core -->
    <circle cx="0" cy="0" r="35" fill="#1b1406" stroke="#d39e00" stroke-width="1.5"/>

    <!-- The 5 Iconic Hole Openings (Pentagon-like openings of woven ball) -->
    <!-- Center Hole -->
    <circle cx="0" cy="0" r="8" fill="#0c0a04"/>
    <!-- Surrounding 5 Holes -->
    <circle cx="0" cy="-21" r="7" fill="#0c0a04"/>
    <circle cx="20" cy="-6" r="7" fill="#0c0a04"/>
    <circle cx="12" cy="18" r="7" fill="#0c0a04"/>
    <circle cx="-12" cy="18" r="7" fill="#0c0a04"/>
    <circle cx="-20" cy="-6" r="7" fill="#0c0a04"/>

    <!-- Interwoven Rattan Straps / Bands -->
    <!-- Horizontal & curved interwoven loops -->
    <path d="M -35 0 C -20 15, 20 15, 35 0 C 20 -15, -20 -15, -35 0" fill="none" stroke="url(#rattan-band)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M -20 -28 C -5 -10, 5 20, 20 28" fill="none" stroke="url(#rattan-band)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 20 -28 C 5 -10, -5 20, -20 28" fill="none" stroke="url(#rattan-band)" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#rattan-band)" stroke-width="5" stroke-dasharray="24 12"/>

    <!-- Woven Split Ribs (Textures on the rattan strips) -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="url(#rattan-band)" stroke-width="3"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#684a00" stroke-width="0.8"/>

    <!-- Highlight -->
    <ellipse cx="-12" cy="-14" rx="7" ry="3" transform="rotate(-30 -12 -14)" fill="rgba(255,255,255,0.4)"/>
  </g>
</svg>