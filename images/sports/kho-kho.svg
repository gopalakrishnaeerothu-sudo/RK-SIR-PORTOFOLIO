<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-khokho" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1a0e"/>
      <stop offset="100%" stop-color="#0e0703"/>
    </linearGradient>
    <linearGradient id="border-khokho" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="50%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#d35400"/>
    </linearGradient>
    <filter id="glow-khokho" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#f39c12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Frame -->
  <rect x="8" y="8" width="144" height="144" rx="28" fill="url(#bg-khokho)" stroke="url(#border-khokho)" stroke-width="2"/>
  <circle cx="80" cy="80" r="54" fill="none" stroke="rgba(243,156,18,0.12)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Kho-Kho Court Central Lane & Squares -->
  <g stroke="rgba(255,255,255,0.2)" stroke-width="1.2">
    <!-- Center Line -->
    <line x1="28" y1="116" x2="132" y2="116" stroke-width="2" stroke="#f39c12"/>
    <!-- Cross lanes / Sitting squares -->
    <rect x="36" y="112" width="14" height="8" fill="none"/>
    <rect x="58" y="112" width="14" height="8" fill="none"/>
    <rect x="88" y="112" width="14" height="8" fill="none"/>
    <rect x="110" y="112" width="14" height="8" fill="none"/>
  </g>

  <!-- Kho-Kho Wooden Pole (Turn Post) -->
  <g filter="url(#glow-khokho)">
    <!-- Base post -->
    <rect x="38" y="44" width="8" height="72" rx="4" fill="#e67e22" stroke="#f39c12" stroke-width="1.5"/>
    <!-- Dome cap -->
    <ellipse cx="42" cy="44" rx="6" ry="3" fill="#f1c40f"/>
    <!-- Wood grain rings -->
    <line x1="39" y1="58" x2="45" y2="58" stroke="#ba4a00" stroke-width="1.5"/>
    <line x1="39" y1="74" x2="45" y2="74" stroke="#ba4a00" stroke-width="1.5"/>
    <line x1="39" y1="90" x2="45" y2="90" stroke="#ba4a00" stroke-width="1.5"/>
  </g>

  <!-- Running Chaser / Dodger Silhouette -->
  <g filter="url(#glow-khokho)" fill="#f39c12">
    <!-- Head -->
    <circle cx="106" cy="46" r="6"/>
    <!-- Torso leaning forward -->
    <path d="M 103 54 L 92 76 L 86 73 L 99 52 Z"/>
    <!-- Arms sprinting / reaching to give "KHO" -->
    <path d="M 101 54 L 118 64 L 123 60 L 103 52 Z"/>
    <path d="M 99 56 L 82 50 L 80 54 L 97 60 Z"/>
    <!-- Front Leg in stride -->
    <path d="M 92 75 L 112 88 L 116 106 L 111 107 L 107 92 L 89 78 Z"/>
    <!-- Back Leg thrust -->
    <path d="M 88 74 L 74 86 L 62 90 L 60 86 L 72 82 L 86 70 Z"/>
  </g>

  <!-- Sitting Chaser (Crouch position facing away) -->
  <g fill="rgba(255,255,255,0.75)">
    <circle cx="65" cy="100" r="4"/>
    <path d="M 62 104 C 58 108, 58 114, 66 114 C 70 114, 70 108, 66 104 Z"/>
  </g>

  <!-- Sprint / Motion Speed Lines -->
  <g stroke="#f1c40f" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="56" y1="64" x2="72" y2="64"/>
    <line x1="50" y1="72" x2="68" y2="72"/>
    <line x1="58" y1="80" x2="70" y2="80"/>
  </g>
</svg>
