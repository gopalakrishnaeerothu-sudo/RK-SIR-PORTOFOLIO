<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-football" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c231e"/>
      <stop offset="100%" stop-color="#030c0a"/>
    </linearGradient>
    <linearGradient id="border-football" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="50%" stop-color="#1abc9c"/>
      <stop offset="100%" stop-color="#16a085"/>
    </linearGradient>
    <radialGradient id="ball-grad" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#dcdde1"/>
      <stop offset="100%" stop-color="#718093"/>
    </radialGradient>
    <filter id="glow-football" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2ecc71" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Frame -->
  <rect x="8" y="8" width="144" height="144" rx="28" fill="url(#bg-football)" stroke="url(#border-football)" stroke-width="2"/>
  <circle cx="80" cy="80" r="54" fill="none" stroke="rgba(46,204,113,0.12)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Dynamic Motion Arcs -->
  <path d="M 32 94 A 52 52 0 0 1 128 66" fill="none" stroke="rgba(46,204,113,0.3)" stroke-width="2" stroke-linecap="round" stroke-dasharray="12 8"/>

  <!-- Football (Soccer Ball) -->
  <g filter="url(#glow-football)" transform="translate(80, 80)">
    <!-- Base sphere -->
    <circle cx="0" cy="0" r="36" fill="url(#ball-grad)" stroke="#1e272e" stroke-width="1.8"/>

    <!-- Central Pentagon -->
    <polygon points="0,-12 11.4,-3.7 7,9.7 -7,9.7 -11.4,-3.7" fill="#1e272e"/>

    <!-- Top Pentagon Edge Lines & Outer Pentagons -->
    <line x1="0" y1="-12" x2="0" y2="-25" stroke="#1e272e" stroke-width="2"/>
    <path d="M 0 -25 L -9 -34 A 36 36 0 0 1 9 -34 Z" fill="#1e272e"/>

    <!-- Upper Right Connection -->
    <line x1="11.4" y1="-3.7" x2="23" y2="-7.5" stroke="#1e272e" stroke-width="2"/>
    <polygon points="23,-7.5 32,-16 35,-6 28,3 23,-7.5" fill="#1e272e"/>

    <!-- Lower Right Connection -->
    <line x1="7" y1="9.7" x2="14" y2="21" stroke="#1e272e" stroke-width="2"/>
    <polygon points="14,21 17,32 29,26 26,14 14,21" fill="#1e272e"/>

    <!-- Lower Left Connection -->
    <line x1="-7" y1="9.7" x2="-14" y2="21" stroke="#1e272e" stroke-width="2"/>
    <polygon points="-14,21 -26,14 -29,26 -17,32 -14,21" fill="#1e272e"/>

    <!-- Upper Left Connection -->
    <line x1="-11.4" y1="-3.7" x2="-23" y2="-7.5" stroke="#1e272e" stroke-width="2"/>
    <polygon points="-23,-7.5 -28,3 -35,-6 -32,-16 -23,-7.5" fill="#1e272e"/>

    <!-- Outer Hexagon seam lines -->
    <line x1="0" y1="-25" x2="23" y2="-7.5" stroke="#1e272e" stroke-width="1.8"/>
    <line x1="23" y1="-7.5" x2="14" y2="21" stroke="#1e272e" stroke-width="1.8"/>
    <line x1="14" y1="21" x2="-14" y2="21" stroke="#1e272e" stroke-width="1.8"/>
    <line x1="-14" y1="21" x2="-23" y2="-7.5" stroke="#1e272e" stroke-width="1.8"/>
    <line x1="-23" y1="-7.5" x2="0" y2="-25" stroke="#1e272e" stroke-width="1.8"/>

    <!-- Specular Highlight -->
    <ellipse cx="-12" cy="-14" rx="8" ry="4" transform="rotate(-35 -12 -14)" fill="rgba(255,255,255,0.45)"/>
  </g>
</svg>