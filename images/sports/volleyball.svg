<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-vball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b36"/>
      <stop offset="100%" stop-color="#040914"/>
    </linearGradient>
    <linearGradient id="border-vball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbc531"/>
      <stop offset="50%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#192a56"/>
    </linearGradient>
    <filter id="glow-vball" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00a8ff" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Frame -->
  <rect x="8" y="8" width="144" height="144" rx="28" fill="url(#bg-vball)" stroke="url(#border-vball)" stroke-width="2"/>
  <circle cx="80" cy="80" r="54" fill="none" stroke="rgba(251,197,49,0.12)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Net Mesh Background -->
  <g stroke="rgba(255,255,255,0.18)" stroke-width="1">
    <line x1="28" y1="112" x2="132" y2="112" stroke-width="2" stroke="rgba(255,255,255,0.4)"/>
    <line x1="28" y1="124" x2="132" y2="124"/>
    <line x1="40" y1="112" x2="40" y2="132"/>
    <line x1="60" y1="112" x2="60" y2="132"/>
    <line x1="80" y1="112" x2="80" y2="132"/>
    <line x1="100" y1="112" x2="100" y2="132"/>
    <line x1="120" y1="112" x2="120" y2="132"/>
  </g>

  <!-- Volleyball -->
  <g filter="url(#glow-vball)" transform="translate(80, 72)">
    <!-- Base ball circle -->
    <circle cx="0" cy="0" r="36" fill="#0b1b36"/>

    <!-- Panel Group 1 (Top: Blue) -->
    <path d="M 0 0 L -18 -31.1 A 36 36 0 0 1 18 -31.1 Z" fill="#0077c8"/>
    <path d="M -6 -10.4 L -18 -31.1 A 36 36 0 0 1 -6 -35.5 Z" fill="#005a9c"/>
    <path d="M 6 -10.4 L 6 -35.5 A 36 36 0 0 1 18 -31.1 Z" fill="#2998ec"/>

    <!-- Panel Group 2 (Bottom Left: Yellow) -->
    <path d="M 0 0 L -36 0 A 36 36 0 0 0 -18 31.1 Z" fill="#fbc531"/>
    <path d="M -12 0 L -36 0 A 36 36 0 0 0 -31.1 18 Z" fill="#e1a511"/>
    <path d="M -6 10.4 L -31.1 18 A 36 36 0 0 0 -18 31.1 Z" fill="#fcd969"/>

    <!-- Panel Group 3 (Bottom Right: White / Light) -->
    <path d="M 0 0 L 18 31.1 A 36 36 0 0 0 36 0 Z" fill="#f5f6fa"/>
    <path d="M 6 10.4 L 18 31.1 A 36 36 0 0 0 31.1 18 Z" fill="#dcdde1"/>
    <path d="M 12 0 L 31.1 18 A 36 36 0 0 0 36 0 Z" fill="#ffffff"/>

    <!-- Panel Seam Grooves -->
    <circle cx="0" cy="0" r="36" fill="none" stroke="#1e272e" stroke-width="2.2"/>
    <path d="M 0 0 L 0 -36 M 0 0 L -31.1 18 M 0 0 L 31.1 18" stroke="#1e272e" stroke-width="2"/>
    <path d="M -18 -31.1 L 0 0 L 18 -31.1" stroke="#1e272e" stroke-width="1.8"/>
    <path d="M -36 0 L 0 0 L -18 31.1" stroke="#1e272e" stroke-width="1.8"/>
    <path d="M 36 0 L 0 0 L 18 31.1" stroke="#1e272e" stroke-width="1.8"/>

    <!-- Highlight -->
    <ellipse cx="-12" cy="-14" rx="7" ry="3" transform="rotate(-30 -12 -14)" fill="rgba(255,255,255,0.4)"/>
  </g>
</svg>
